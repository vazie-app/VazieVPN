name: CI

# Every push to main and every pull request: the debug build, unit tests, lint and the project's own checks, a
# minified release built unsigned and scanned, a secret scan, and — on pull requests — a review of new dependencies.
# Nothing here signs, publishes or reads a secret: a pull request from a fork runs exactly what one from this
# repository runs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Public placeholders: CI never needs the real endpoints. The release workflow uses the official ones.
env:
  VAZIE_API_URL: https://api.example.com/v1
  VAZIE_SITE_URL: https://example.com

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Pinned Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" > /dev/null

      # The pinned Gradle, and the wrapper jar generated from it and validated.
      - uses: ./.github/actions/gradle

      # One invocation so compilation is shared. `check` covers unit tests, lint, checkModuleRules,
      # checkDesignTokens, checkLocalization and checkPreviewConvention.
      - name: Debug build, tests and lint
        run: ./gradlew --no-daemon check assembleDebug :app:lintDebug

      # Unsigned: no signing material exists in this workflow.
      - name: Minified release, scanned
        run: >
          ./gradlew --no-daemon
          :app:assembleRelease
          :app:lintRelease
          :app:checkReleaseGraph
          :app:checkReleaseArtifact

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            apps/android/**/build/reports/
            apps/android/**/build/test-results/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks binary from its release, checked against a pinned SHA-256 before it runs.
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # The whole history and the working tree; findings are redacted in the log.
      - name: Scan
        run: |
          gitleaks git . --redact --no-banner --exit-code 1
          gitleaks dir . --redact --no-banner --exit-code 1

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fails a pull request that adds a dependency with a known vulnerability of moderate severity or above.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
