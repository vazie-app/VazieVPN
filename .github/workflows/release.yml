name: Release build

# Builds, verifies and signs the release artifacts for a version tag (`v1.0.0`), and keeps them as a workflow
# artifact for the maintainer. It does NOT create a GitHub Release or publish anything: the maintainer reviews the
# artifacts and publishes the release by hand.
#
# Signing secrets live only in the `release` environment. Protect it in the repository settings (Settings →
# Environments → release): required reviewer — the maintainer; deployment tags — `v*` only. A pull request, a fork or
# a branch can never reach these secrets: this workflow runs only for a pushed tag.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The SHA-256 of the signing certificate every published Vazie VPN APK carries. A different key would make the
  # release impossible to install over an existing one, so a mismatch stops the build.
  EXPECTED_CERT_SHA256: 970fbd4614aadaa171fb4c9aa58f6df0adad98c2c6d06252b5d3ad0d54f0a3aa

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    # The official addresses are not in the repository: the maintainer keeps them in the `release` environment.
    env:
      VAZIE_API_URL: ${{ secrets.VAZIE_API_URL }}
      VAZIE_SITE_URL: ${{ secrets.VAZIE_SITE_URL }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Pinned Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" > /dev/null

      - uses: ./.github/actions/gradle

      # A tag must describe the source it points at, otherwise the artifacts and the version in the app disagree.
      - name: The tag matches versionName, and release notes exist
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared=$(sed -n 's/^vazieVersionName = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          [ "$version" = "$declared" ] || { echo "::error::tag $GITHUB_REF_NAME does not match vazieVersionName $declared"; exit 1; }
          for language in en ru; do
            [ -s "docs/release-notes/$version.$language.md" ] || { echo "::error::docs/release-notes/$version.$language.md is missing"; exit 1; }
          done

      # A tag build that cannot sign is a failure, not an unsigned release.
      - name: Place the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.VAZIE_KEYSTORE_BASE64 }}
          VAZIE_KEYSTORE_PASSWORD: ${{ secrets.VAZIE_KEYSTORE_PASSWORD }}
          VAZIE_KEY_ALIAS: ${{ secrets.VAZIE_KEY_ALIAS }}
          VAZIE_KEY_PASSWORD: ${{ secrets.VAZIE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 VAZIE_KEYSTORE_PASSWORD VAZIE_KEY_ALIAS VAZIE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::signing secrets are missing from the release environment:$missing"; exit 1; }
          keystore="$RUNNER_TEMP/vazie-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "VAZIE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Check, build, sign and scan
        env:
          VAZIE_KEYSTORE_PASSWORD: ${{ secrets.VAZIE_KEYSTORE_PASSWORD }}
          VAZIE_KEY_ALIAS: ${{ secrets.VAZIE_KEY_ALIAS }}
          VAZIE_KEY_PASSWORD: ${{ secrets.VAZIE_KEY_PASSWORD }}
        # Two invocations: with `bundle` among the tasks the build turns the per-ABI split off (see `splits` in
        # app/build.gradle.kts), and the release would carry the universal APK only.
        run: |
          ./gradlew --no-daemon check :app:assembleRelease :app:lintRelease :app:checkReleaseGraph :app:checkReleaseArtifact
          ./gradlew --no-daemon :app:bundleRelease

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/vazie-release.jks"

      # Every APK: a valid v2/v3 signature, by the certificate users already have.
      - name: Verify the signatures
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/37.0.0)/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --min-sdk-version 28 "$apk"
            # "Signer #1 certificate SHA-256 digest: …" or, in newer build-tools, "V2 Signer: certificate SHA-256 digest: …";
            # every scheme must name the one expected certificate.
            cert=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
            [ "$cert" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::$apk is signed by $cert, expected $EXPECTED_CERT_SHA256"; exit 1; }
            echo "$(basename "$apk"): signature OK"
          done

      # GPL §6: the engine inside the APK carries GPL-3.0 code, so its Corresponding Source goes with every release —
      # the libXray tag the engine was built from, with every Go module it compiles in (`go mod vendor`).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: false
      - name: The engine's source
        run: |
          version=$(sed -n 's/^val libXrayVersion = "\(.*\)"/\1/p' vpn/engine/xray/build.gradle.kts)
          [ -n "$version" ] || { echo "::error::no libXrayVersion in vpn/engine/xray/build.gradle.kts"; exit 1; }
          src="$RUNNER_TEMP/libXray-$version-source"
          git clone --quiet --depth 1 --branch "$version" https://github.com/XTLS/libXray.git "$src"
          ( cd "$src" && go mod vendor && rm -rf .git )
          tar -czf "$RUNNER_TEMP/libXray-$version-source.tar.gz" -C "$RUNNER_TEMP" "libXray-$version-source"
          echo "ENGINE_SOURCE=$RUNNER_TEMP/libXray-$version-source.tar.gz" >> "$GITHUB_ENV"

      - name: Checksums and release notes
        run: |
          out="$RUNNER_TEMP/vazie-vpn-$GITHUB_REF_NAME"
          mkdir -p "$out"
          cp app/build/outputs/apk/release/*.apk "$out/"
          cp "$ENGINE_SOURCE" "$out/"
          cp docs/release-notes/"${GITHUB_REF_NAME#v}".*.md "$out/"
          ( cd "$out" && sha256sum *.apk *.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt )
          echo "SIGNING_CERT_SHA256=$EXPECTED_CERT_SHA256" > "$out/SIGNING_CERTIFICATE.txt"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Keep the artifacts for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vazie-vpn-${{ github.ref_name }}
          path: ${{ env.OUT }}
          retention-days: 30
          if-no-files-found: error

      # R8 mapping and native symbols, to read crash stack traces a user sends; never published with the APK.
      - name: Keep mapping and symbols
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vazie-vpn-${{ github.ref_name }}-diagnostics
          path: |
            apps/android/app/build/outputs/mapping/release/mapping.txt
            apps/android/app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          retention-days: 90
          if-no-files-found: warn
