[package]
name = "vazie-vpn-host"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The native helper behind the Vazie VPN browser extension: runs Xray on a loopback-only proxy"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
